services:
    postgres:
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
            POSTGRES_TEST_DATABASE: ${DB_TEST_DATABASE:-laravel_test}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    evolution-go:
        image: evoapicloud/evolution-go:0.7.2
        environment:
            SERVER_PORT: 8080
            CLIENT_NAME: evolution
            GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-evolution-local-key}
            POSTGRES_AUTH_DB: >-
                postgresql://${DB_USERNAME:-laravel}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-laravel}?sslmode=disable&options=-csearch_path%3Devolution
            POSTGRES_USERS_DB: >-
                postgresql://${DB_USERNAME:-laravel}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-laravel}?sslmode=disable&options=-csearch_path%3Devolution
            DATABASE_SAVE_MESSAGES: ${EVOLUTION_DATABASE_SAVE_MESSAGES:-false}
            WADEBUG: ${EVOLUTION_WADEBUG:-INFO}
            LOGTYPE: console
            WEBHOOK_FILES: 'true'
            CONNECT_ON_STARTUP: 'true'
            OS_NAME: Evolution GO
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${EVOLUTION_PORT:-8080}:8080'
        volumes:
            - evolution-go-data:/app/dbdata
            - evolution-go-logs:/app/logs
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${MAIL_PORT:-1025}:1025'
            - '${MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
    postgres-data:
    evolution-go-data:
    evolution-go-logs:
    redis-data:
